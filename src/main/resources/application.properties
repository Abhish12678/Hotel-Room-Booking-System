spring.application.name=hotel-room-booking
server.port=8080

# MySQL (override with env vars: DB_USER, DB_PASSWORD, DB_URL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Serve index.html as the welcome page
spring.web.resources.static-locations=classpath:/static/

# Admin credentials (override with env vars: ADMIN_USER, ADMIN_PASSWORD)
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
